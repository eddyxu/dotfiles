# Configuration for Tmux

# Makes modern TUIs, italics, and undercurl happy.
set -g default-terminal "tmux-256color"

# --- Modern TUIs (claude / codex) over ssh ---
# Truecolor (works on tmux >= 2.2 via Tc/RGB, 3.2+ via terminal-features)
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"
set -sqa terminal-features ",*:RGB"
# No ESC delay (otherwise Esc to interrupt feels laggy over ssh)
set -sg escape-time 10
# Let apps receive focus in/out events
set -g focus-events on
# Extended keys so Shift+Enter / Ctrl+Enter etc. reach the app
set -sq extended-keys on
set -sqa terminal-features ",xterm*:extkeys,*:extkeys"
set -sq extended-keys-format csi-u
# Clipboard: let apps copy via OSC 52 through tmux and over ssh to local machine
set -g set-clipboard on
set -sqa terminal-features ",*:clipboard"
# Allow apps to pass escape sequences (OSC 52, notifications, images) through
set -gq allow-passthrough on
# Long output from agents
set -g history-limit 200000
# Fast repaint, propagate title/bell so notifications work
set -g set-titles on
set -g set-titles-string "#h: #W"
set -g monitor-bell on
set -g bell-action any
# Resize to the smallest *active* client
set -g aggressive-resize on

# Use screen style prefix
unbind C-b
set -g prefix C-a

set -g mouse on

set-option -g status on

# colors
set-option -g status-style fg=yellow,bg=black #base02

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default

# pane border
set-option -g pane-border-style bg=black #base02
set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style fg=brightred,bg=black #base02

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green

# Mouse
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; send-keys -M'"


